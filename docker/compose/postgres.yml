# Postgres service — included from root docker-compose.yml
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starter}
      POSTGRES_DB: ${POSTGRES_DB:-starter}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/18/docker, so mount the parent dir.
      # New volume name: the old postgres_data volume holds a Postgres 16 cluster and is not
      # compatible. See docker/README.md "Upgrading from Postgres 16" to migrate existing data.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-starter} -d ${POSTGRES_DB:-starter}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres18_data:

# Render Blueprint — Nest API + AI API + Neon (external).
# https://render.com/docs/blueprint-spec
#
# Neon: create a project at https://console.neon.tech, copy the pooled
# connection string into DATABASE_URL in the Render dashboard (or sync:false below).
#
# After first deploy, set CORS_ORIGIN / WEB_APP_URL / WEBAUTHN_* to your Vercel web URL.

services:
  - type: web
    name: starter-nest-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/nest-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: AUTH_DEV_EXPOSE_CODES
        value: "false"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: APP_NAME
        value: Starter
      # Paste from Neon console (pooled URL recommended).
      - key: DATABASE_URL
        sync: false
      # Generate strong secrets in the Render dashboard if empty after create.
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      # Required for auth emails in production (https://resend.com).
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      # Set after Vercel web is live, e.g. https://starter.vercel.app
      - key: WEB_APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false

  # Bun + Hono AI API (apps/ai-api). Uses the same Neon database (needs the `vector` extension,
  # which Neon supports; the migration runs CREATE EXTENSION) and the nest-api JWT_SECRET.
  - type: web
    name: starter-ai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/ai-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_PROVIDER_NAME
        value: openrouter
      - key: AI_CHAT_MODEL
        value: openai/gpt-4o-mini
      - key: AI_EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      # Same Neon pooled URL as starter-nest-api.
      - key: DATABASE_URL
        sync: false
      # Must equal starter-nest-api's JWT_SECRET so nest access tokens verify here.
      - key: JWT_SECRET
        fromService:
          type: web
          name: starter-nest-api
          envVarKey: JWT_SECRET
      # OpenRouter (or other OpenAI-compatible) key. Set in the dashboard; never commit it.
      - key: AI_API_KEY
        sync: false
      # Set after Vercel web is live, e.g. https://starter.vercel.app
      - key: CORS_ORIGIN
        sync: false

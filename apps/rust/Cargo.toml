[package]
name = "starter-rust"
version = "0.1.0"
edition = "2021"
description = "Rust app for starter monorepo"
rust-version = "1.86"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
uuid = { version = "1.29.0", features = ["v4"] }
bcrypt = "0.19.3"
sha2 = "0.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
time = "0.3.55"
axum-extra = { version = "0.12.6", features = ["cookie"] }

[profile.release]
lto = true
codegen-units = 1
